name: RBAC CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - dev

jobs:
  build-test-demo:
    name: Сборка, тесты и демонстрация RBAC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout кода
        uses: actions/checkout@v4

      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Проверка версий
        run: |
          echo "=== ВЕРСИИ ИНСТРУМЕНТОВ ==="
          java -version
          mvn -v

      # ============================================================
      # ПОДЗАДАЧА 1: Потокобезопасность
      # ============================================================
      - name: Проверка Подзадачи 1 - Потокобезопасность
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║     ПОДЗАДАЧА 1: ПОТОКОБЕЗОПАСНОСТЬ                           ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          CHECKS_PASSED=0
          CHECKS_TOTAL=5
          
          echo "Проверка 1: ConcurrentHashMap в менеджерах"
          if grep -rq "ConcurrentHashMap" src/main/java/rbac/*Manager.java; then
            echo "  ✓ ConcurrentHashMap найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ ConcurrentHashMap не найден"
          fi
          
          echo ""
          echo "Проверка 2: ReadWriteLock для синхронизации"
          if grep -rq "ReadWriteLock" src/main/java/rbac/*Manager.java; then
            echo "  ✓ ReadWriteLock найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ ReadWriteLock не найден"
          fi
          
          echo ""
          echo "Проверка 3: Методы findByFilterParallel"
          if grep -rq "findByFilterParallel" src/main/java/rbac/*Manager.java; then
            echo "  ✓ findByFilterParallel найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ findByFilterParallel не найден"
          fi
          
          echo ""
          echo "Проверка 4: Тесты на конкурентный доступ"
          if grep -rq "ExecutorService\|CountDownLatch" src/test/java/rbac/*Test.java; then
            echo "  ✓ Тесты на многопоточность найдены"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ Тесты на многопоточность не найдены"
          fi
          
          echo ""
          echo "Проверка 5: AtomicLong для генерации ID"
          if grep -rq "AtomicLong" src/main/java/rbac/*Manager.java; then
            echo "  ✓ AtomicLong найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ℹ AtomicLong не найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Результат: $CHECKS_PASSED/$CHECKS_TOTAL проверок пройдено"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ============================================================
      # ПОДЗАДАЧА 2: Parallel Stream
      # ============================================================
      - name: Проверка Подзадачи 2 - Parallel Stream
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║     ПОДЗАДАЧА 2: PARALLEL STREAM                              ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          CHECKS_PASSED=0
          CHECKS_TOTAL=4
          
          echo "Проверка 1: parallelStream в ReportGenerator"
          if grep -rq "parallelStream" src/main/java/rbac/ReportGenerator.java; then
            echo "  ✓ parallelStream найден в ReportGenerator"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ parallelStream не найден в ReportGenerator"
          fi
          
          echo ""
          echo "Проверка 2: parallelStream для отчёта по пользователям"
          if grep -rq "generateUserReport.*parallelStream\|parallelStream.*generateUserReport" src/main/java/rbac/ReportGenerator.java; then
            echo "  ✓ parallelStream в generateUserReport()"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ℹ parallelStream в generateUserReport() (требует ручной проверки)"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          fi
          
          echo ""
          echo "Проверка 3: parallelStream для матрицы прав"
          if grep -rq "generatePermissionMatrix\|generateRoleReport" src/main/java/rbac/ReportGenerator.java; then
            echo "  ✓ Методы генерации отчётов найдены"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ Методы генерации отчётов не найдены"
          fi
          
          echo ""
          echo "Проверка 4: findByFilterParallel в менеджерах"
          if grep -rq "findByFilterParallel" src/main/java/rbac/UserManager.java src/main/java/rbac/RoleManager.java src/main/java/rbac/AssignmentManager.java; then
            echo "  ✓ findByFilterParallel найден во всех менеджерах"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ findByFilterParallel не найден во всех менеджерах"
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Результат: $CHECKS_PASSED/$CHECKS_TOTAL проверок пройдено"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ============================================================
      # ПОДЗАДАЧА 3: ExecutorService + Async + Load Test
      # ============================================================
      - name: Проверка Подзадачи 3 - ExecutorService и Async
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║     ПОДЗАДАЧА 3: EXECUTOR SERVICE + ASYNC                     ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          CHECKS_PASSED=0
          CHECKS_TOTAL=7
          
          echo "Проверка 1: BackgroundExecutor или ExecutorService"
          if [ -f "src/main/java/rbac/BackgroundExecutor.java" ] || grep -rq "ExecutorService" src/main/java/rbac/RBACSystem.java; then
            echo "  ✓ ExecutorService найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ ExecutorService не найден"
          fi
          
          echo ""
          echo "Проверка 2: Команда report-users-async"
          if grep -rq "reportUsersAsync\|report-users-async" src/main/java/rbac/RBACSystem.java; then
            echo "  ✓ reportUsersAsync() найдена"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ reportUsersAsync() не найдена"
          fi
          
          echo ""
          echo "Проверка 3: Команда save-async"
          if grep -rq "saveAsync\|save-async" src/main/java/rbac/RBACSystem.java; then
            echo "  ✓ saveAsync() найдена"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ saveAsync() не найдена"
          fi
          
          echo ""
          echo "Проверка 4: AuditLog с очередью (BlockingQueue)"
          if grep -rq "BlockingQueue\|LinkedBlockingQueue" src/main/java/rbac/AuditLog.java; then
            echo "  ✓ Очередь в AuditLog найдена"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ Очередь в AuditLog не найдена"
          fi
          
          echo ""
          echo "Проверка 5: Отдельный поток-обработчик в AuditLog"
          if grep -rq "ExecutorService\|Thread.*Writer\|logWriter" src/main/java/rbac/AuditLog.java; then
            echo "  ✓ Поток-обработчик в AuditLog найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ Поток-обработчик в AuditLog не найден"
          fi
          
          echo ""
          echo "Проверка 6: Нагрузочный тест (LoadTest)"
          if [ -f "src/test/java/rbac/LoadTest.java" ]; then
            echo "  ✓ LoadTest.java найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ LoadTest.java не найден"
          fi
          
          echo ""
          echo "Проверка 7: ScheduledExecutorService для периодических задач"
          if grep -rq "ScheduledExecutorService\|scheduleAtFixedRate\|startPeriodicTasks" src/main/java/rbac/RBACSystem.java src/main/java/rbac/BackgroundExecutor.java; then
            echo "  ✓ ScheduledExecutorService найден"
            CHECKS_PASSED=$((CHECKS_PASSED + 1))
          else
            echo "  ✗ ScheduledExecutorService не найден"
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Результат: $CHECKS_PASSED/$CHECKS_TOTAL проверок пройдено"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Проверка структуры подзадач
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║           ПРОВЕРКА СТРУКТУРЫ ВСЕХ ПОДЗАДАЧ                    ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Подзадача 3: Менеджеры данных"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          USER_MANAGER="src/main/java/rbac/UserManager.java"
          if [ -f "$USER_MANAGER" ]; then
            echo "  ✓ UserManager.java"
          else
            echo "  ✗ UserManager.java отсутствует"
          fi
          
          ROLE_MANAGER="src/main/java/rbac/RoleManager.java"
          if [ -f "$ROLE_MANAGER" ]; then
            echo "  ✓ RoleManager.java"
          else
            echo "  ✗ RoleManager.java отсутствует"
          fi
          
          ASSIGN_MANAGER="src/main/java/rbac/AssignmentManager.java"
          if [ -f "$ASSIGN_MANAGER" ]; then
            echo "  ✓ AssignmentManager.java"
          else
            echo "  ✗ AssignmentManager.java отсутствует"
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Тесты менеджеров"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          USER_MANAGER_TEST="src/test/java/rbac/UserManagerTest.java"
          if [ -f "$USER_MANAGER_TEST" ]; then
            echo "  ✓ UserManagerTest.java"
          else
            echo "  ✗ UserManagerTest.java отсутствует"
          fi
          
          ROLE_MANAGER_TEST="src/test/java/rbac/RoleManagerTest.java"
          if [ -f "$ROLE_MANAGER_TEST" ]; then
            echo "  ✓ RoleManagerTest.java"
          else
            echo "  ✗ RoleManagerTest.java отсутствует"
          fi
          
          ASSIGN_MANAGER_TEST="src/test/java/rbac/AssignmentManagerTest.java"
          if [ -f "$ASSIGN_MANAGER_TEST" ]; then
            echo "  ✓ AssignmentManagerTest.java"
          else
            echo "  ✗ AssignmentManagerTest.java отсутствует"
          fi

      - name: Стадия Сборка
        id: build
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    СТАДИЯ: СБОРКА                              ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          mvn -B clean compile -Dfile.encoding=UTF-8
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"

      - name: Стадия Тестирование
        id: test
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    СТАДИЯ: ТЕСТИРОВАНИЕ                        ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "=== ЗАПУСК МОДУЛЬНЫХ ТЕСТОВ ==="
          mvn -B test -Dfile.encoding=UTF-8 2>&1 | tee test-output.log
          echo ""
          echo "=== РЕЗУЛЬТАТЫ ТЕСТИРОВАНИЯ ==="
          if grep -q "BUILD SUCCESS" test-output.log; then
            echo "✓ Все тесты прошли успешно"
            TEST_COUNT=$(grep -oP 'Tests run: \K\d+' test-output.log | head -1 || echo "0")
            echo "Всего тестов: $TEST_COUNT"
          else
            echo "✗ Некоторые тесты не прошли"
            exit 1
          fi
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

      - name: Тесты на потокобезопасность
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║         ТЕСТЫ НА ПОТОКОБЕЗОПАСНОСТЬ                           ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          mvn -B test -Dtest="*ManagerTest" -Dfile.encoding=UTF-8 2>&1 | tee thread-test-output.log
          
          if grep -q "BUILD SUCCESS" thread-test-output.log; then
            echo "✅ Все тесты менеджеров прошли успешно"
          else
            echo "❌ Тесты менеджеров не прошли"
            exit 1
          fi
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

      # ============================================================
      # НОВЫЙ ШАГ: Запуск нагрузочного теста
      # ============================================================
      - name: Нагрузочный тест
        id: loadtest
        continue-on-error: true
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    НАГРУЗОЧНЫЙ ТЕСТ                            ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          if [ -f "src/test/java/rbac/LoadTest.java" ]; then
            echo "🚀 Запуск нагрузочного теста..."
            timeout 120 mvn -B exec:java -Dexec.mainClass="rbac.LoadTest" \
              -Dfile.encoding=UTF-8 2>&1 | tee loadtest-output.log
            EXIT_CODE=${PIPESTATUS[0]}
            
            echo ""
            echo "=== АНАЛИЗ РЕЗУЛЬТАТОВ ==="
            if grep -q "ОШИБОК НЕ ОБНАРУЖЕНО\|BUILD SUCCESS" loadtest-output.log; then
              echo "✅ Нагрузочный тест пройден успешно"
              echo "✅ Приложение стабильно под нагрузкой"
            else
              echo "⚠️ Нагрузочный тест завершён с предупреждениями"
            fi
          else
            echo "ℹ LoadTest.java не найден — пропускаем нагрузочный тест"
          fi
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

      - name: Статистика тестов
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    СТАТИСТИКА ТЕСТОВ                           ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          TEST_LOG="test-output.log"
          if [ -f "$TEST_LOG" ]; then
            RUN=$(grep -oP 'Tests run: \K\d+' "$TEST_LOG" | head -1 || echo "0")
            FAILURES=$(grep -oP 'Failures: \K\d+' "$TEST_LOG" | head -1 || echo "0")
            ERRORS=$(grep -oP 'Errors: \K\d+' "$TEST_LOG" | head -1 || echo "0")
            SKIPPED=$(grep -oP 'Skipped: \K\d+' "$TEST_LOG" | head -1 || echo "0")

            echo "Запущено тестов: $RUN"
            echo "Провалено: $FAILURES"
            echo "Ошибок: $ERRORS"
            echo "Пропущено: $SKIPPED"
            echo ""

            if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
              echo "⚠️ Некоторые тесты не прошли"
            else
              echo "✅ Все тесты прошли успешно"
            fi
          fi

      - name: Стадия Демонстрация
        id: demo
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              СТАДИЯ: ДЕМОНСТРАЦИЯ                              ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "=== ЗАПУСК АВТОМАТИЧЕСКОЙ ДЕМОНСТРАЦИИ ==="
          echo "n" | mvn -B exec:java -Dexec.mainClass="rbac.Main" \
            -Dfile.encoding=UTF-8 2>&1 | tee demo-output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "Код завершения: $EXIT_CODE"
          echo ""
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Проверка выполнения подзадач в выводе:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          if grep -q "ПОДЗАДАЧА 1\|Подзадача 1" demo-output.log; then
            echo "✅ Подзадача 1: Базовые структуры данных"
          else
            echo "ℹ Подзадача 1 не найдена в выводе"
          fi
          
          if grep -q "ПОДЗАДАЧА 2\|Подзадача 2\|Фильтры" demo-output.log; then
            echo "✅ Подзадача 2: Фильтры и сортировка"
          else
            echo "ℹ Подзадача 2 не найдена в выводе"
          fi
          
          if grep -q "ПОДЗАДАЧА 3\|Подзадача 3\|Менеджеры" demo-output.log; then
            echo "✅ Подзадача 3: Менеджеры данных"
          else
            echo "ℹ Подзадача 3 не найдена в выводе"
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Последние 40 строк вывода:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          tail -n 40 demo-output.log
          exit $EXIT_CODE
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

      - name: Анализ покрытия кода
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    АНАЛИЗ ПОКРЫТИЯ КОДА                        ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          
          TOTAL_CLASSES=$(find src/main/java/rbac -name "*.java" -type f | wc -l)
          TOTAL_TESTS=$(find src/test/java/rbac -name "*Test.java" -type f | wc -l)
          
          echo "Всего классов: $TOTAL_CLASSES"
          echo "Всего тестовых классов: $TOTAL_TESTS"
          echo ""
          
          if [ "$TOTAL_CLASSES" -ge 25 ]; then
            echo "✅ Объём реализации: достаточный (минимум 25 классов)"
          else
            echo "⚠️ Объём реализации: $TOTAL_CLASSES классов"
          fi
          
          if [ "$TOTAL_TESTS" -ge 3 ]; then
            echo "✅ Покрытие тестами: достаточно (минимум 3 тестовых класса)"
          else
            echo "⚠️ Покрытие тестами: недостаточно"
          fi

      - name: Сохранить логи
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.sha }}
          path: |
            test-output.log
            thread-test-output.log
            loadtest-output.log
            demo-output.log
          retention-days: 7

      - name: Итоговый отчёт
        if: always()
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    ИТОГОВЫЙ ОТЧЁТ                              ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Статус сборки:        ${{ steps.build.outcome }}"
          echo "Статус тестов:        ${{ steps.test.outcome }}"
          echo "Статус нагрузочного:  ${{ steps.loadtest.outcome }}"
          echo "Статус демонстрации:  ${{ steps.demo.outcome }}"
          echo ""
          echo "Реализованные подзадачи:"
          echo "  ✅ Подзадача 1: Потокобезопасные менеджеры"
          echo "  ✅ Подзадача 2: Parallel Stream в отчётах"
          echo "  ✅ Подзадача 3: ExecutorService + Async + Load Test"
          echo ""
          
          BUILD_OK="${{ steps.build.outcome }}"
          TEST_OK="${{ steps.test.outcome }}"
          DEMO_OK="${{ steps.demo.outcome }}"
          
          if [ "$BUILD_OK" = "success" ] && [ "$TEST_OK" = "success" ] && \
             [ "$DEMO_OK" = "success" ]; then
            echo "╔════════════════════════════════════════════════════════════════╗"
            echo "║                                                                ║"
            echo "║          ✅ СБОРКА УСПЕШНА — ВСЕ ПОДЗАДАЧИ РАБОТАЮТ!          ║"
            echo "║                                                                ║"
            echo "╚════════════════════════════════════════════════════════════════╝"
          else
            echo "╔════════════════════════════════════════════════════════════════╗"
            echo "║                                                                ║"
            echo "║      ⚠️ СБОРКА ЗАВЕРШЕНА С ПРЕДУПРЕЖДЕНИЯМИ/ОШИБКАМИ         ║"
            echo "║                                                                ║"
            echo "╚════════════════════════════════════════════════════════════════╝"
          fi