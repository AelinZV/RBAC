name: RBAC CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - dev

jobs:
  build-and-demo:
    name: Сборка и демонстрация RBAC
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout кода
        uses: actions/checkout@v4
        
      - name: Настройка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Проверка версии Java
        run: |
          java -version
          mvn -v
      
      - name: Стадия Сборка
        id: build
        run: mvn -B clean compile -Dfile.encoding=UTF-8
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
      
      - name: Стадия Демонстрация
        id: demo
        run: |
          mvn -B exec:java -Dexec.mainClass="rbac.Main" -Dfile.encoding=UTF-8 2>&1 | tee demo-output.log || echo "Демонстрация завершена (возможны исключения при тестировании валидации)"
          echo ""
          echo "=== ВЫВОД ДЕМОНСТРАЦИИ ==="
          cat demo-output.log
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      
      - name: Сохранить лог демонстрации
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-output
          path: demo-output.log
          retention-days: 7