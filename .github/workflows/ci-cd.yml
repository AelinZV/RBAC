name: RBAC CI/CD Pipeline

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-demo:
    name: Сборка и демонстрация RBAC
    runs-on: ubuntu-latest
    
    steps:
      # 1. Получение кода из репозитория
      - name: 📥 Checkout кода
        uses: actions/checkout@v4
        
      # 2. Настройка Java 17 и кэширование Maven
      - name: ⚙️ Настройка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'  # Автоматическое кэширование зависимостей Maven
      
      # 3. СТАДИЯ: Сборка проекта
      - name: 🏗️ Стадия: Сборка (Build)
        id: build
        run: |
          echo "=== Начало сборки проекта ==="
          mvn compile -Dfile.encoding=UTF-8 --batch-mode
          echo "=== Сборка успешно завершена ==="
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
      
      # 4. СТАДИЯ: Демонстрация работы
      - name: 🎮 Стадия: Демонстрация (Demo)
        id: demo
        run: |
          echo "=== Запуск демонстрации RBAC ==="
          mvn exec:java -Dexec.mainClass="rbac.Main" -Dfile.encoding=UTF-8 --batch-mode 2>&1 | tee demo-output.log
          echo "=== Демонстрация завершена ==="
          
          # Показываем вывод с поддержкой кириллицы
          echo ""
          echo "📋 Вывод демонстрации:"
          cat demo-output.log
        env:
          MAVEN_OPTS: "-Dfile.encoding=UTF-8"
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      
      # 5. Артефакт: сохранение лога демонстрации
      - name: 💾 Сохранить лог демонстрации
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-output
          path: demo-output.log
          retention-days: 7
